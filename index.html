<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Day English · 每日社交英语</title><style>
:root{--ink:#25352f;--muted:#758178;--accent:#426a53;--line:#e4e9df;--paper:#f7f8f2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 'Segoe UI','Microsoft YaHei',sans-serif}button,a,input,textarea{font:inherit}button{cursor:pointer}a{color:var(--accent)}header{padding:22px 5vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fff}.brand{font-family:Georgia,serif;font-size:24px}.brand i{color:#738b49}header span{color:var(--muted);font-size:13px}.layout{max-width:1280px;margin:0 auto;padding:38px 32px;display:grid;grid-template-columns:245px 1fr;gap:40px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted)}h1{font-size:34px;line-height:1.3;margin:12px 0}h2{font-size:19px;margin:0 0 12px}.subtitle{color:var(--muted);margin:8px 0 22px}.hero{background:#e8efdf;border-radius:22px;padding:30px}.tag{font-size:12px;background:#ffffffb0;padding:5px 12px;border-radius:20px;margin-right:6px}.hero footer{margin-top:23px;display:flex;align-items:center;gap:14px}.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 20px;text-decoration:none;display:inline-block}.hint{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;margin-top:18px}.body{white-space:pre-wrap;line-height:1.95}.body.english{font-family:Georgia,'Microsoft YaHei',serif;font-size:18px}details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;color:var(--accent);font-size:14px}aside{position:sticky;top:22px;align-self:start}aside h2{font-size:15px;margin:8px 0 20px}.day{display:block;border:0;background:transparent;text-align:left;padding:13px 15px;margin:6px 0;width:100%;border-radius:12px;color:var(--ink)}.day.active{background:#e4edda}.day small{display:block;color:var(--muted);font-size:12px}.steps{display:flex;gap:6px;flex-wrap:wrap;margin:23px 0 4px}.steps a{font-size:12px;padding:5px 10px;background:#fff;border:1px solid var(--line);border-radius:20px;text-decoration:none}label.done{font-size:12px;color:var(--muted);display:block;margin-top:20px}input[type=checkbox]{accent-color:var(--accent)}textarea{width:100%;min-height:95px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);margin-top:12px}progress{accent-color:var(--accent);width:100%;height:7px}.progress-label{font-size:12px;color:var(--muted)}.empty{padding:28px}.status{font-size:12px;color:var(--muted);margin-top:12px}.rail-note{border-top:1px solid var(--line);padding-top:20px;margin-top:25px;font-size:12px;color:var(--muted)}.questions li{margin:7px 0}.save-note{font-size:11px;color:var(--muted)}@media(max-width:760px){header{padding:16px 20px}header span{display:none}.layout{display:block;padding:20px 16px}aside{position:static;margin-bottom:20px}.history{display:flex;overflow:auto}.day{min-width:200px}.rail-note{display:none}.hero{padding:23px}h1{font-size:27px}.card{padding:21px}.hero footer{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="brand">a day <i>English.</i></div><span>每天一点，聊得更自然 · 北京时间 08:00 生成 · 08:10 起同步</span></header><div class="layout"><aside><div class="eyebrow">YOUR LEARNING JOURNAL</div><h2>我的每日课程</h2><div class="history" id="history"></div><div class="rail-note">先听，再读，最后说。<br>课程保存在云端；勾选和笔记保存在当前浏览器。<div id="update" class="status"></div></div></aside><main><div id="content" class="empty">正在读取课程…</div></main></div><script>
var lessons=[],current;var $=function(id){return document.getElementById(id)};function el(tag,text,cls){var n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function stored(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function key(s){return 'english:'+current.date+':'+s}function render(l){current=l;var root=$('content');root.replaceChildren();root.className='';document.querySelectorAll('.day').forEach(function(b){b.classList.toggle('active',b.dataset.date===l.date)});var hero=el('section',undefined,'hero');hero.append(el('div',l.date+' / DAILY PRACTICE','eyebrow'),el('h1',l.title),el('p',l.subtitle||'','subtitle'));hero.append(el('span',l.level||'社交英语','tag'),el('span',(l.minutes||25)+' 分钟','tag'));var foot=el('footer');if(l.audio){var a=el('a','▶ 打开今天的听力','primary');a.href=l.audio.url;a.target='_blank';a.rel='noopener noreferrer';foot.append(a,el('span',l.audio.title+' · '+l.audio.source,'hint'));}hero.append(foot);if(l.audio&&l.audio.note)hero.append(el('div',l.audio.note,'status'));root.append(hero);var p=el('div',undefined,'card');var caption=el('div',undefined,'progress-label'),bar=el('progress');bar.max=l.sections.length;p.append(caption,bar);root.append(p);function refresh(){var count=l.sections.filter(function(s){return stored(key(s.id+':done'),false)}).length;bar.value=count;caption.textContent='今日完成 '+count+' / '+l.sections.length+' · 不急，按自己的节奏来'}refresh();var nav=el('nav',undefined,'steps');l.sections.forEach(function(s){var a=el('a',s.title.split('·')[1]||s.title);a.href='#section-'+s.id;nav.append(a)});root.append(nav);l.sections.forEach(function(s){var c=el('section',undefined,'card');c.id='section-'+s.id;c.append(el('h2',s.title),el('div',s.body,'body'+(s.id==='read'?' english':'')));if(s.questions){var q=el('ol',undefined,'questions');s.questions.forEach(function(t){q.append(el('li',t))});c.append(q)}[['translation','查看中文译文'],['answers','完成后再看参考答案']].forEach(function(pair){if(s[pair[0]]){var d=el('details');d.append(el('summary',pair[1]),el('div',s[pair[0]],'body'));c.append(d)}});var label=el('label',undefined,'done'),cb=el('input');cb.type='checkbox';cb.checked=stored(key(s.id+':done'),false);cb.onchange=function(){save(key(s.id+':done'),cb.checked);refresh()};label.append(cb,document.createTextNode(' 我完成了这一部分'));c.append(label);root.append(c)});var notes=el('section',undefined,'card');notes.append(el('h2','给今天留一点记录'),el('div','第一遍听懂几成？哪一句最卡？也可以写下你的英文回答。','hint'));var area=el('textarea');area.placeholder='例如：第一遍听懂 50%，地名和连读最难…';area.value=stored(key('notes'),'');area.oninput=function(){save(key('notes'),area.value)};notes.append(area,el('div','自动保存在当前浏览器。需要点评时，请将答案发到原聊天。','save-note'));root.append(notes)}async function load(){try{var r=await fetch('./lessons/index.json');if(!r.ok)throw Error('读取失败');lessons=await r.json();$('history').replaceChildren();if(!lessons.length){$('content').textContent='第一课正在准备，请稍后刷新。';return}lessons.forEach(function(l){var b=el('button',undefined,'day');b.dataset.date=l.date;b.append(el('small',l.date),el('span',l.title));b.onclick=function(){render(l)};$('history').append(b)});var date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date());$('update').textContent=lessons[0].date===date?'今日课程已更新':'最新课程：'+lessons[0].date+'，今天的课程尚未更新';render(lessons.find(function(l){return current&&l.date===current.date})||lessons[0])}catch(e){$('content').textContent='课程暂时无法读取，请刷新重试。'}}load();
</script></body></html>
