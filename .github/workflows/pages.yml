name: Publish English lessons
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '10 0 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize daily lessons
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          LESSON_SOURCE_URL: ${{ vars.LESSON_SOURCE_URL }}
          LESSON_SOURCE_TOKEN: ${{ secrets.LESSON_SOURCE_TOKEN }}
        run: node scripts/sync-lessons.mjs
      - name: Preserve updated lessons in GitHub
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lessons/
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily English lessons'
            git push
          fi
      - uses: actions/configure-pages@v5
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
